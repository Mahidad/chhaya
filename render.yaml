# Render Blueprint for the Chhaya API.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render reads
# this file and creates the service. Values marked sync:false are prompted for
# on first deploy and never stored in git.
#
# NOTE ON UPLOADS: notes, exam papers, and narration audio are written to
# UPLOAD_ROOT. A disk is declared below because Render wipes a service's own
# filesystem on every deploy -- without it those files vanish. Disks require a
# paid instance; on the free tier, remove the `disk:` block and expect uploads
# to be lost on each deploy.
services:
  - type: web
    name: chhaya-api
    runtime: python
    plan: starter
    rootDir: chhaya-backend
    # The WordNet corpus is a separate ~10MB download that `pip install nltk`
    # does not fetch. Without it the glossary silently falls back to mock
    # definitions, so pull it during the build.
    buildCommand: pip install -r requirements.txt && python -m nltk.downloader wordnet omw-1.4
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: chhaya-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.11"
      - key: ENV
        value: production
      - key: UPLOAD_ROOT
        value: /var/data/uploads
      # Neon connection string, including ?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      # Your Vercel URL. Comma-separated for more than one.
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Model names get retired -- gemini-2.0-flash and 2.5-flash both now
      # 404. If AI calls start failing with NOT_FOUND, check the current
      # list at ai.google.dev/gemini-api/docs/models and update this.
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      # OCR.Space extracts text from uploaded exam papers and image notes.
      # Free key: ocr.space/ocrapi -> Register. Without it every upload fails
      # with "OCR.Space is not configured".
      - key: OCR_SPACE_API_KEY
        sync: false
      # Resend sends the review reminder emails. Optional -- review schedules
      # still work without it, the emails just report as skipped.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # The weekly refresh is owned by the cron job below, so the web
      # service does not need to do it. Flip to "true" only if you are on a
      # plan without cron jobs -- then the API refreshes on startup instead,
      # whenever the last successful run is older than PRACTICE_REFRESH_DAYS.
      - key: PRACTICE_AUTO_IMPORT
        value: "false"
      - key: PRACTICE_REFRESH_DAYS
        value: "7"
      # Needed by whichever side runs the import. Get a token from
      # kaggle.com -> Settings -> API -> Create New Token; the JSON contains
      # both values.
      - key: KAGGLE_USERNAME
        sync: false
      - key: KAGGLE_KEY
        sync: false

  # ---------------------------------------------------------------------
  # Weekly refresh of the practice bank from Kaggle.
  #
  # Runs the same importer the CLI does. It only ADDS problems the upstream
  # dataset has gained -- rows already present are matched on title_slug and
  # skipped, and nothing is updated or deleted, so student attempts pointing
  # at existing problems are never disturbed.
  #
  # Sunday 03:00 UTC: off-peak, and a weekly cadence matches how rarely these
  # datasets actually change.
  # ---------------------------------------------------------------------
  - type: cron
    name: chhaya-practice-refresh
    runtime: python
    plan: starter
    rootDir: chhaya-backend
    schedule: "0 3 * * 0"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/import_practice_problems.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.11"
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PRACTICE_DATASET_SLUG
        value: gzipchrist/leetcode-problem-dataset
      - key: KAGGLE_USERNAME
        sync: false
      - key: KAGGLE_KEY
        sync: false
